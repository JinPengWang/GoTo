name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Validate rules
        shell: powershell
        run: python -m json.tool rules.json | Out-Null

      - name: Validate Python source
        run: python -m py_compile redirector.py

      - name: Build GoTo.exe
        run: python -m PyInstaller --onefile --noconsole --name GoTo --clean --noconfirm --version-file version_info.txt redirector.py

      - name: Prepare release package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release\GoTo | Out-Null
          Copy-Item dist\GoTo.exe release\GoTo\
          Copy-Item rules.json release\GoTo\
          Copy-Item install.bat release\GoTo\
          Copy-Item uninstall.bat release\GoTo\
          Copy-Item repair.bat release\GoTo\
          Copy-Item README_INSTALL.txt release\GoTo\
          Copy-Item README.md release\GoTo\
          Copy-Item LICENSE release\GoTo\
          $files = @('GoTo.exe','rules.json','install.bat','uninstall.bat','repair.bat','README_INSTALL.txt','README.md','LICENSE')
          Push-Location release\GoTo
          $files | ForEach-Object {
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $_
            '{0}  {1}' -f $hash.Hash.ToLower(), $_
          } | Set-Content -Encoding ascii -LiteralPath SHA256SUMS.txt
          Pop-Location
          Compress-Archive -Path release\GoTo\* -DestinationPath GoTo-Windows.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoTo-Windows
          path: GoTo-Windows.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: GoTo-Windows.zip
