name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true

      - name: Validate rules
        shell: powershell
        run: |
          Get-Content -Raw -Encoding UTF8 rules.json | ConvertFrom-Json | Out-Null
          Write-Host "rules.json is valid."

      - name: Download Go dependencies
        run: go mod tidy

      - name: Run Go Unit Tests
        run: go test -v ./...

      - name: Build Ultra-Fast Native GoTo.exe
        run: go build -ldflags="-H=windowsgui -s -w" -o GoTo.exe .

      - name: Prepare release package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release\GoTo | Out-Null
          Copy-Item GoTo.exe release\GoTo\
          Copy-Item rules.json release\GoTo\
          Copy-Item install.bat release\GoTo\
          Copy-Item uninstall.bat release\GoTo\
          Copy-Item repair.bat release\GoTo\
          Copy-Item README.md release\GoTo\
          Copy-Item README.en.md release\GoTo\
          Copy-Item LICENSE release\GoTo\
          $files = @('GoTo.exe','rules.json','install.bat','uninstall.bat','repair.bat','README.md','README.en.md','LICENSE')
          Push-Location release\GoTo
          $files | ForEach-Object {
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $_
            '{0}  {1}' -f $hash.Hash.ToLower(), $_
          } | Set-Content -Encoding ascii -LiteralPath SHA256SUMS.txt
          Pop-Location
          Compress-Archive -Path release\GoTo\* -DestinationPath GoTo-Windows.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoTo-Windows
          path: GoTo-Windows.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: GoTo-Windows.zip
